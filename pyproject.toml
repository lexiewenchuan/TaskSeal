[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskseal"
version = "0.1.0"
description = "A task-first control plane for trustworthy agent work."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "lexiewenchuan" }
]
keywords = [
  "agents",
  "ai-agents",
  "authorization",
  "evidence",
  "orchestration"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Application Frameworks"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lexiewenchuan/TaskSeal"
Repository = "https://github.com/lexiewenchuan/TaskSeal"
Issues = "https://github.com/lexiewenchuan/TaskSeal/issues"

[project.scripts]
taskseal = "taskseal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
