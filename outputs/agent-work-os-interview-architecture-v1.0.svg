<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #6b7280; }
    .section { font-size: 17px; font-weight: 700; }
    .node-title { font-size: 15px; font-weight: 650; }
    .node-sub { font-size: 11px; fill: #6b7280; }
    .tiny { font-size: 10px; fill: #6b7280; }
    .chip { font-size: 11px; font-weight: 650; }
    .label { font-size: 10px; font-weight: 600; }
  </style>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
    </marker>
    <marker id="orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#ea580c"/>
    </marker>
    <marker id="purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/>
    </marker>
    <marker id="green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
    </marker>
    <marker id="teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#0f766e"/>
    </marker>
    <marker id="gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1600" height="1080" fill="#ffffff"/>
  <text x="55" y="45" class="title">Agent Work OS · 面向可信任务执行的通用 Agent 框架</text>
  <text x="55" y="72" class="subtitle">让任意 Agent 在统一任务、权限、资源和证据体系中协作，并把验证过的经验安全地沉淀为能力</text>

  <!-- loop chips -->
  <rect x="1040" y="28" width="115" height="28" rx="14" fill="#dbeafe"/>
  <text x="1097" y="47" text-anchor="middle" class="chip" fill="#1d4ed8">① 决策闭环</text>
  <rect x="1165" y="28" width="115" height="28" rx="14" fill="#ede9fe"/>
  <text x="1222" y="47" text-anchor="middle" class="chip" fill="#6d28d9">② 执行闭环</text>
  <rect x="1290" y="28" width="115" height="28" rx="14" fill="#dcfce7"/>
  <text x="1347" y="47" text-anchor="middle" class="chip" fill="#15803d">③ 验收闭环</text>
  <rect x="1415" y="28" width="130" height="28" rx="14" fill="#ccfbf1"/>
  <text x="1480" y="47" text-anchor="middle" class="chip" fill="#0f766e">④ 成长闭环</text>

  <!-- region backgrounds -->
  <rect data-graph-role="container" x="55" y="100" width="1490" height="125" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect data-graph-role="container" x="55" y="245" width="1490" height="200" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <rect data-graph-role="container" x="55" y="465" width="920" height="235" rx="12" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect data-graph-role="container" x="995" y="465" width="550" height="235" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect data-graph-role="container" x="55" y="720" width="1490" height="130" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="7,4"/>
  <rect data-graph-role="container" x="55" y="870" width="1490" height="140" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>

  <text x="75" y="126" class="section" fill="#1d4ed8">01 · 目标进入统一任务体系</text>
  <text x="75" y="272" class="section" fill="#c2410c">02 · 控制平面：决定为什么做、允许做什么、由谁做</text>
  <text x="75" y="492" class="section" fill="#6d28d9">03 · 执行平面：兼容不同 Agent 和工具</text>
  <text x="1015" y="492" class="section" fill="#15803d">04 · 可信验收：执行成功不等于任务完成</text>
  <text x="75" y="747" class="section">05 · 任务本体与共享事实底座</text>
  <text x="75" y="897" class="section" fill="#047857">06 · 受控成长：经验先成为候选，再通过评测晋升</text>

  <!-- arrows behind nodes -->
  <path d="M 260 172 L 315 172" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#blue)"/>
  <path d="M 515 172 L 570 172" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#blue)"/>
  <path d="M 830 172 L 885 172" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#blue)"/>
  <path d="M 1145 172 L 1200 172" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#blue)"/>
  <path d="M 1015 215 L 1015 285" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>

  <path d="M 300 345 L 340 345" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#orange)"/>
  <path d="M 580 345 L 620 345" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#orange)"/>
  <path d="M 860 345 L 900 345" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#orange)"/>
  <path d="M 1140 345 L 1180 345" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#orange)"/>
  <path d="M 1320 405 L 1320 455 L 255 455 L 255 515" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)"/>

  <path d="M 375 565 L 425 565" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)"/>
  <path d="M 635 565 L 685 565" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)"/>
  <path d="M 805 615 L 805 645" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)"/>
  <path d="M 925 565 L 1050 565" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#green)"/>
  <path d="M 1260 565 L 1300 565" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#green)"/>

  <path d="M 220 760 L 40 760 L 40 430 L 195 430 L 195 405" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#gray)"/>
  <path d="M 1400 625 L 1520 625 L 1520 740 L 1380 740 L 1380 760" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#green)"/>

  <path d="M 1100 825 L 1100 865 L 305 865 L 305 920" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#teal)"/>
  <path d="M 420 955 L 455 955" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#teal)"/>
  <path d="M 665 955 L 700 955" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#teal)"/>
  <path d="M 910 955 L 945 955" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#teal)"/>
  <path d="M 1155 955 L 1190 955" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#teal)"/>
  <path d="M 1400 920 L 1400 855 L 520 855 L 520 825" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#teal)"/>

  <!-- entry nodes -->
  <rect x="90" y="140" width="170" height="65" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="175" y="166" text-anchor="middle" class="node-title">目标发起人</text>
  <text x="175" y="187" text-anchor="middle" class="node-sub">用户 · 系统 · 事件</text>

  <rect x="315" y="140" width="200" height="65" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="415" y="166" text-anchor="middle" class="node-title">统一接入</text>
  <text x="415" y="187" text-anchor="middle" class="node-sub">聊天 · 页面 · API · 主动触发</text>

  <rect x="570" y="130" width="260" height="85" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
  <rect x="575" y="135" width="250" height="75" rx="8" fill="none" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="700" y="159" text-anchor="middle" class="node-title">任务单 · Work Item</text>
  <text x="700" y="181" text-anchor="middle" class="node-sub">目标 · 范围 · 状态 · 风险 · 验收标准</text>
  <text x="700" y="199" text-anchor="middle" class="tiny">跨模型、跨会话、跨执行者的唯一顶层载体</text>

  <rect x="885" y="140" width="260" height="65" rx="9" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1015" y="166" text-anchor="middle" class="node-title">任务状态机</text>
  <text x="1015" y="187" text-anchor="middle" class="node-sub">草稿 → 就绪 → 执行 → 验收 → 完成</text>

  <rect x="1200" y="140" width="285" height="65" rx="9" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1342" y="166" text-anchor="middle" class="node-title">人类责任点</text>
  <text x="1342" y="187" text-anchor="middle" class="node-sub">澄清 · 批准 · 例外 · 高风险验收</text>

  <!-- control plane nodes -->
  <rect x="90" y="300" width="210" height="105" rx="9" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="195" y="327" text-anchor="middle" class="node-title">上下文与本体解析</text>
  <text x="195" y="350" text-anchor="middle" class="node-sub">资源 · 能力 · 契约 · 历史决定</text>
  <text x="195" y="370" text-anchor="middle" class="node-sub">事实 / 参考 / 未知信息分离</text>
  <text x="195" y="390" text-anchor="middle" class="tiny">记忆不能自动成为事实</text>

  <rect x="340" y="300" width="240" height="105" rx="9" fill="#ffffff" stroke="#fb923c" stroke-width="1.8"/>
  <text x="460" y="327" text-anchor="middle" class="node-title">规划与任务拆解</text>
  <text x="460" y="350" text-anchor="middle" class="node-sub">复用 / 扩展 / 修复 / 创建</text>
  <text x="460" y="370" text-anchor="middle" class="node-sub">依赖 · 子任务 · 预期产物</text>
  <text x="460" y="390" text-anchor="middle" class="tiny">为每一步同时设计验收方法</text>

  <rect x="620" y="300" width="240" height="105" rx="9" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="740" y="327" text-anchor="middle" class="node-title">规则与风险中心</text>
  <text x="740" y="350" text-anchor="middle" class="node-sub">禁止项 · 风险等级 · 审批点</text>
  <text x="740" y="370" text-anchor="middle" class="node-sub">最小权限 · 职责分离</text>
  <text x="740" y="390" text-anchor="middle" class="tiny">风险决定治理强度</text>

  <rect x="900" y="300" width="240" height="105" rx="9" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="1020" y="327" text-anchor="middle" class="node-title">授权与资源占用</text>
  <text x="1020" y="350" text-anchor="middle" class="node-sub">主体 · 资源 · 动作 · 条件</text>
  <text x="1020" y="370" text-anchor="middle" class="node-sub">有效期 · 租约 · 撤销 · 版本</text>
  <text x="1020" y="390" text-anchor="middle" class="tiny">子 Agent 不能继承更多权限</text>

  <rect x="1180" y="290" width="280" height="115" rx="11" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="1185" y="295" width="270" height="105" rx="8" fill="none" stroke="#fb923c" stroke-width="0.8"/>
  <text x="1320" y="323" text-anchor="middle" class="node-title">总调度 · Orchestrator</text>
  <text x="1320" y="348" text-anchor="middle" class="node-sub">选择执行者 · 并行 · 等待 · 汇总</text>
  <text x="1320" y="370" text-anchor="middle" class="node-sub">预算重试 · 重新规划 · 人工升级</text>
  <text x="1320" y="391" text-anchor="middle" class="tiny">不能绕过授权，也不能宣布最终完成</text>

  <!-- execution nodes -->
  <rect x="95" y="515" width="280" height="100" rx="9" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="235" y="542" text-anchor="middle" class="node-title">Agent 运行适配</text>
  <text x="235" y="565" text-anchor="middle" class="node-sub">Codex · LangGraph · Raven · 固定程序</text>
  <text x="235" y="585" text-anchor="middle" class="node-sub">统一输入、运行限制、进度和结果</text>
  <text x="235" y="603" text-anchor="middle" class="tiny">框架不绑定模型和 Agent Runtime</text>

  <rect x="425" y="515" width="210" height="100" rx="9" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="530" y="542" text-anchor="middle" class="node-title">执行者池</text>
  <text x="530" y="565" text-anchor="middle" class="node-sub">通用 Agent · 专业 Agent</text>
  <text x="530" y="585" text-anchor="middle" class="node-sub">程序 · 外部服务 · 人</text>
  <text x="530" y="603" text-anchor="middle" class="tiny">按能力、权限和可靠性选择</text>

  <rect x="685" y="515" width="240" height="100" rx="9" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="805" y="542" text-anchor="middle" class="node-title">资源操作入口</text>
  <text x="805" y="565" text-anchor="middle" class="node-sub">授权复查 · 幂等 · 版本观察</text>
  <text x="805" y="585" text-anchor="middle" class="node-sub">统一执行工具并记录前后状态</text>
  <text x="805" y="603" text-anchor="middle" class="tiny">所有真实副作用必须经过这里</text>

  <rect x="685" y="645" width="240" height="38" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="805" y="669" text-anchor="middle" class="node-title">真实资源：代码 · 文档 · 数据 · 系统</text>

  <!-- acceptance nodes -->
  <rect x="1050" y="515" width="210" height="100" rx="9" fill="#ffffff" stroke="#4ade80" stroke-width="1.8"/>
  <text x="1155" y="542" text-anchor="middle" class="node-title">产物与证据</text>
  <text x="1155" y="565" text-anchor="middle" class="node-sub">来源 · 时间 · 版本 · 完整性</text>
  <text x="1155" y="585" text-anchor="middle" class="node-sub">观察结果逐项对应验收标准</text>
  <text x="1155" y="603" text-anchor="middle" class="tiny">运行轨迹帮助解释，但不自动成为证据</text>

  <rect x="1300" y="505" width="200" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
  <text x="1400" y="535" text-anchor="middle" class="node-title">独立验收</text>
  <text x="1400" y="560" text-anchor="middle" class="node-sub">固定规则 · 独立 Agent · 人</text>
  <text x="1400" y="582" text-anchor="middle" class="node-sub">通过 → 任务完成</text>
  <text x="1400" y="602" text-anchor="middle" class="node-sub">失败 → 回到对应环节</text>

  <rect x="1090" y="645" width="365" height="38" rx="19" fill="#f0fdf4"/>
  <text x="1272" y="669" text-anchor="middle" class="chip" fill="#15803d">完成 = 验收标准被可信证据证明</text>

  <!-- foundation nodes -->
  <rect x="90" y="760" width="260" height="65" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="220" y="785" text-anchor="middle" class="node-title">任务本体</text>
  <text x="220" y="807" text-anchor="middle" class="node-sub">目标 · 任务 · 主体 · 资源 · 动作 · 证据</text>

  <rect x="385" y="760" width="270" height="65" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="520" y="785" text-anchor="middle" class="node-title">资源 / 能力 / 契约目录</text>
  <text x="520" y="807" text-anchor="middle" class="node-sub">组织已经拥有什么，当前版本和负责人是谁</text>

  <rect x="690" y="760" width="250" height="65" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="815" y="785" text-anchor="middle" class="node-title">任务状态与事件</text>
  <text x="815" y="807" text-anchor="middle" class="node-sub">事件日志 · 状态投影 · 恢复点 · 并发控制</text>

  <rect x="975" y="760" width="250" height="65" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="1100" y="785" text-anchor="middle" class="node-title">产物与证据库</text>
  <text x="1100" y="807" text-anchor="middle" class="node-sub">产物、观察、证据和验收结论分开保存</text>

  <rect x="1260" y="760" width="240" height="65" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="1380" y="785" text-anchor="middle" class="node-title">审计与指标</text>
  <text x="1380" y="807" text-anchor="middle" class="node-sub">责任链 · 成本 · 成功率 · 越权 · 退化</text>

  <!-- growth nodes -->
  <rect x="190" y="920" width="230" height="70" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text x="305" y="946" text-anchor="middle" class="node-title">分层记忆与案例</text>
  <text x="305" y="968" text-anchor="middle" class="node-sub">用户 · 任务 · 技能 · 组织 · 世界信息</text>
  <text x="305" y="984" text-anchor="middle" class="tiny">只接收有来源的任务轨迹</text>

  <rect x="455" y="920" width="210" height="70" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text x="560" y="946" text-anchor="middle" class="node-title">候选能力</text>
  <text x="560" y="968" text-anchor="middle" class="node-sub">技能 · 模板 · 规则 · 调度策略</text>
  <text x="560" y="984" text-anchor="middle" class="tiny">默认不进入正式使用</text>

  <rect x="700" y="920" width="210" height="70" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
  <text x="805" y="946" text-anchor="middle" class="node-title">隔离评测</text>
  <text x="805" y="968" text-anchor="middle" class="node-sub">保留任务 · 效果对比 · 回归检查</text>
  <text x="805" y="984" text-anchor="middle" class="tiny">证明不是只记住历史答案</text>

  <rect x="945" y="920" width="210" height="70" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
  <text x="1050" y="946" text-anchor="middle" class="node-title">风险审查与试用</text>
  <text x="1050" y="968" text-anchor="middle" class="node-sub">权限 · 安全 · 成本 · 小范围验证</text>
  <text x="1050" y="984" text-anchor="middle" class="tiny">高风险变化需要人工批准</text>

  <rect x="1190" y="920" width="210" height="70" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="1295" y="946" text-anchor="middle" class="node-title">晋升或回退</text>
  <text x="1295" y="968" text-anchor="middle" class="node-sub">稳定变好 → 进入能力目录</text>
  <text x="1295" y="984" text-anchor="middle" class="tiny">失败则暂停、回退并保留记录</text>

  <!-- key distinction -->
  <rect x="105" y="1025" width="690" height="32" rx="16" fill="#eff6ff"/>
  <text x="450" y="1046" text-anchor="middle" class="chip" fill="#1d4ed8">普通框架关注：Agent 如何调用工具完成一次运行</text>
  <rect x="805" y="1025" width="690" height="32" rx="16" fill="#f0fdf4"/>
  <text x="1150" y="1046" text-anchor="middle" class="chip" fill="#15803d">本框架关注：目标如何被授权、执行、证明完成并持续改进</text>
</svg>
