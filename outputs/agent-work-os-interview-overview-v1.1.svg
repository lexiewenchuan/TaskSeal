<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" width="1600" height="850">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
    .title { font-size: 29px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #6b7280; }
    .section { font-size: 17px; font-weight: 700; }
    .node-title { font-size: 15px; font-weight: 650; }
    .node-sub { font-size: 11px; fill: #6b7280; }
    .tiny { font-size: 10px; fill: #6b7280; }
    .chip { font-size: 11px; font-weight: 650; }
    .step { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="main-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1600" height="850" fill="#ffffff"/>
  <text x="55" y="45" class="title">Agent Work OS · 面试总览图</text>
  <text x="55" y="72" class="subtitle">一条主流程：目标被建立为任务，在有限授权下执行，用证据完成验收，再把验证过的经验沉淀为能力</text>

  <rect x="1190" y="27" width="355" height="34" rx="17" fill="#fff7ed"/>
  <text x="1367" y="49" text-anchor="middle" class="chip" fill="#c2410c">人类责任点：目标澄清 · 高风险批准 · 例外验收</text>

  <!-- main flow -->
  <rect data-graph-role="container" x="55" y="105" width="1490" height="260" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="78" y="135" class="section">一条主流程 · 从左到右</text>

  <rect x="292" y="126" width="205" height="27" rx="13" fill="#dbeafe"/>
  <text x="394" y="144" text-anchor="middle" class="chip" fill="#1d4ed8">决策闭环</text>
  <rect x="710" y="126" width="175" height="27" rx="13" fill="#ede9fe"/>
  <text x="797" y="144" text-anchor="middle" class="chip" fill="#6d28d9">执行闭环</text>
  <rect x="910" y="126" width="380" height="27" rx="13" fill="#dcfce7"/>
  <text x="1100" y="144" text-anchor="middle" class="chip" fill="#15803d">验收闭环</text>
  <rect x="1315" y="126" width="200" height="27" rx="13" fill="#ccfbf1"/>
  <text x="1415" y="144" text-anchor="middle" class="chip" fill="#0f766e">成长闭环</text>

  <!-- only seven straight arrows -->
  <path d="M 250 245 L 285 245" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#main-arrow)"/>
  <path d="M 465 245 L 500 245" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#main-arrow)"/>
  <path d="M 690 245 L 725 245" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#main-arrow)"/>
  <path d="M 895 245 L 930 245" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#main-arrow)"/>
  <path d="M 1100 245 L 1135 245" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#main-arrow)"/>
  <path d="M 1305 245 L 1340 245" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#main-arrow)"/>

  <!-- main nodes -->
  <rect x="80" y="185" width="170" height="120" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="105" cy="208" r="14" fill="#2563eb"/>
  <text x="105" y="212" text-anchor="middle" class="step">1</text>
  <text x="165" y="223" text-anchor="middle" class="node-title">提出目标</text>
  <text x="165" y="250" text-anchor="middle" class="node-sub">用户 · 系统 · 事件</text>
  <text x="165" y="273" text-anchor="middle" class="node-sub">只描述期望结果</text>
  <text x="165" y="293" text-anchor="middle" class="tiny">不需要知道底层 Agent</text>

  <rect x="285" y="175" width="180" height="140" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="310" cy="198" r="14" fill="#2563eb"/>
  <text x="310" y="202" text-anchor="middle" class="step">2</text>
  <text x="375" y="218" text-anchor="middle" class="node-title">建立任务单</text>
  <text x="375" y="245" text-anchor="middle" class="node-sub">目标 · 范围 · 状态</text>
  <text x="375" y="267" text-anchor="middle" class="node-sub">风险 · 验收标准</text>
  <text x="375" y="291" text-anchor="middle" class="tiny">跨模型、跨会话的顶层载体</text>

  <rect x="500" y="185" width="190" height="120" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <circle cx="525" cy="208" r="14" fill="#ea580c"/>
  <text x="525" y="212" text-anchor="middle" class="step">3</text>
  <text x="595" y="223" text-anchor="middle" class="node-title">规划与授权</text>
  <text x="595" y="250" text-anchor="middle" class="node-sub">整理事实 · 拆解任务</text>
  <text x="595" y="273" text-anchor="middle" class="node-sub">检查风险 · 最小权限</text>
  <text x="595" y="293" text-anchor="middle" class="tiny">先设计怎样证明完成</text>

  <rect x="725" y="185" width="170" height="120" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <circle cx="750" cy="208" r="14" fill="#7c3aed"/>
  <text x="750" y="212" text-anchor="middle" class="step">4</text>
  <text x="810" y="223" text-anchor="middle" class="node-title">受控执行</text>
  <text x="810" y="250" text-anchor="middle" class="node-sub">选择 Agent 或程序</text>
  <text x="810" y="273" text-anchor="middle" class="node-sub">通过统一资源入口</text>
  <text x="810" y="293" text-anchor="middle" class="tiny">所有真实副作用受控</text>

  <rect x="930" y="185" width="170" height="120" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.8"/>
  <circle cx="955" cy="208" r="14" fill="#16a34a"/>
  <text x="955" y="212" text-anchor="middle" class="step">5</text>
  <text x="1015" y="223" text-anchor="middle" class="node-title">收集证据</text>
  <text x="1015" y="250" text-anchor="middle" class="node-sub">产物 · 观察 · 来源</text>
  <text x="1015" y="273" text-anchor="middle" class="node-sub">时间 · 版本 · 完整性</text>
  <text x="1015" y="293" text-anchor="middle" class="tiny">产物不自动成为证据</text>

  <rect x="1135" y="175" width="170" height="140" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
  <circle cx="1160" cy="198" r="14" fill="#16a34a"/>
  <text x="1160" y="202" text-anchor="middle" class="step">6</text>
  <text x="1220" y="218" text-anchor="middle" class="node-title">独立验收</text>
  <text x="1220" y="245" text-anchor="middle" class="node-sub">固定规则 · 独立 Agent · 人</text>
  <text x="1220" y="267" text-anchor="middle" class="node-sub">证据逐项支持验收标准</text>
  <text x="1220" y="291" text-anchor="middle" class="tiny">通过后任务才完成</text>

  <rect x="1340" y="185" width="180" height="120" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
  <circle cx="1365" cy="208" r="14" fill="#0f766e"/>
  <text x="1365" y="212" text-anchor="middle" class="step">7</text>
  <text x="1430" y="223" text-anchor="middle" class="node-title">沉淀能力</text>
  <text x="1430" y="250" text-anchor="middle" class="node-sub">轨迹 → 案例 → 候选能力</text>
  <text x="1430" y="273" text-anchor="middle" class="node-sub">评测 · 试用 · 晋升 / 回退</text>
  <text x="1430" y="293" text-anchor="middle" class="tiny">一次成功不能直接升级</text>

  <rect x="415" y="329" width="770" height="25" rx="12" fill="#eff6ff"/>
  <text x="800" y="346" text-anchor="middle" class="chip" fill="#1d4ed8">唯一主线：目标 → 任务 → 决策 → 执行 → 证据 → 验收 → 成长</text>

  <!-- supporting subsystems, no arrows -->
  <text x="55" y="402" class="section">三个支撑系统 · 不再逐个画连线</text>
  <text x="355" y="402" class="tiny">它们由主流程按阶段调用，细节在工程架构图中展开</text>

  <rect data-graph-role="container" x="55" y="420" width="475" height="190" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="78" y="450" class="section" fill="#c2410c">A · 任务控制中心</text>
  <text x="78" y="474" class="node-sub">负责“为什么做、允许做什么、什么时候交给谁”</text>
  <rect x="80" y="495" width="130" height="42" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="145" y="521" text-anchor="middle" class="chip">上下文整理</text>
  <rect x="225" y="495" width="130" height="42" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="290" y="521" text-anchor="middle" class="chip">规划与拆解</text>
  <rect x="370" y="495" width="130" height="42" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="435" y="521" text-anchor="middle" class="chip">规则与风险</text>
  <rect x="115" y="552" width="155" height="42" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="192" y="578" text-anchor="middle" class="chip">授权与资源占用</text>
  <rect x="290" y="552" width="175" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
  <text x="377" y="578" text-anchor="middle" class="chip">总调度</text>

  <rect data-graph-role="container" x="560" y="420" width="475" height="190" rx="12" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="583" y="450" class="section" fill="#6d28d9">B · Agent 与资源执行环境</text>
  <text x="583" y="474" class="node-sub">负责“这次具体怎样运行、调用工具并影响真实资源”</text>
  <rect x="590" y="495" width="195" height="42" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="687" y="521" text-anchor="middle" class="chip">Agent 运行适配</text>
  <rect x="810" y="495" width="195" height="42" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="907" y="521" text-anchor="middle" class="chip">执行者池</text>
  <rect x="590" y="552" width="195" height="42" rx="8" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="687" y="578" text-anchor="middle" class="chip">统一资源操作入口</text>
  <rect x="810" y="552" width="195" height="42" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="907" y="578" text-anchor="middle" class="chip">代码 · 文档 · 数据 · 系统</text>

  <rect data-graph-role="container" x="1065" y="420" width="480" height="190" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="1088" y="450" class="section" fill="#047857">C · 信任与成长系统</text>
  <text x="1088" y="474" class="node-sub">负责“怎样证明完成，以及哪些经验值得进入未来任务”</text>
  <rect x="1095" y="495" width="195" height="42" rx="8" fill="#ffffff" stroke="#4ade80"/>
  <text x="1192" y="521" text-anchor="middle" class="chip">产物与证据</text>
  <rect x="1315" y="495" width="195" height="42" rx="8" fill="#ffffff" stroke="#4ade80"/>
  <text x="1412" y="521" text-anchor="middle" class="chip">验收流水线</text>
  <rect x="1095" y="552" width="195" height="42" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="1192" y="578" text-anchor="middle" class="chip">分层记忆与案例</text>
  <rect x="1315" y="552" width="195" height="42" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="1412" y="578" text-anchor="middle" class="chip">评测 · 试用 · 回退</text>

  <!-- shared foundation -->
  <rect data-graph-role="container" x="55" y="635" width="1490" height="125" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="78" y="665" class="section">共同底座 · 所有阶段共享，不逐条连线</text>

  <rect x="85" y="685" width="250" height="55" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="210" y="707" text-anchor="middle" class="node-title">任务本体</text>
  <text x="210" y="727" text-anchor="middle" class="node-sub">目标 · 主体 · 资源 · 动作 · 证据</text>

  <rect x="375" y="685" width="250" height="55" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="500" y="707" text-anchor="middle" class="node-title">资源 / 能力 / 契约目录</text>
  <text x="500" y="727" text-anchor="middle" class="node-sub">已有能力 · 当前版本 · 负责人</text>

  <rect x="665" y="685" width="250" height="55" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="790" y="707" text-anchor="middle" class="node-title">任务状态与事件</text>
  <text x="790" y="727" text-anchor="middle" class="node-sub">事件日志 · 恢复点 · 并发控制</text>

  <rect x="955" y="685" width="250" height="55" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="1080" y="707" text-anchor="middle" class="node-title">产物与证据库</text>
  <text x="1080" y="727" text-anchor="middle" class="node-sub">来源 · 时间 · 版本 · 验收关系</text>

  <rect x="1245" y="685" width="250" height="55" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="1370" y="707" text-anchor="middle" class="node-title">审计与指标</text>
  <text x="1370" y="727" text-anchor="middle" class="node-sub">责任链 · 成本 · 成功率 · 退化</text>

  <!-- interview takeaway -->
  <rect x="90" y="785" width="675" height="38" rx="19" fill="#eff6ff"/>
  <text x="427" y="810" text-anchor="middle" class="chip" fill="#1d4ed8">普通 Agent 框架：重点解决 Agent 怎样完成一次运行</text>
  <rect x="835" y="785" width="675" height="38" rx="19" fill="#f0fdf4"/>
  <text x="1172" y="810" text-anchor="middle" class="chip" fill="#15803d">Agent Work OS：重点解决目标怎样被可信完成并持续改进</text>
</svg>
