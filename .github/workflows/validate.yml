name: validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TaskSeal and contract validator
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check check-jsonschema==0.33.3

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Run CLI smoke test
        run: taskseal --database /tmp/taskseal.db demo --workspace /tmp/taskseal-demo

      - name: Validate Work Item example
        run: >-
          check-jsonschema
          --schemafile spec/work-item.schema.json
          examples/software-change/work-item.json

      - name: Check patch whitespace
        run: git diff-tree --check --root -r HEAD
